version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/docker/frontend"
      - "/docker/nginx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # The official postgres image is re-pushed under the same tags every few days,
      # which restarts the cooldown each time, so no update PR would ever be opened.
      exclude:
        - "postgres"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
