version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/docker/frontend"
      - "/docker/nginx"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Postgres major upgrades need pg_upgrade or dump/restore, not just a new image tag.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
