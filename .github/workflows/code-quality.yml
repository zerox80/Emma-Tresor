name: Code quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-limits:
    name: Repository limits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Enforce file and line limits
        run: python scripts/check_code_quality.py

      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"

      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}..${{ github.sha }}"

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: ci-only-secret-key-longer-than-thirty-two-bytes

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run backend tests
        run: python manage.py test

      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit -r requirements.txt

  postgres:
    name: Backend on PostgreSQL 19
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Prepare an existing PostgreSQL 16 installation
        run: |
          cp env.example .env
          cat > "$RUNNER_TEMP/pg16.yml" <<'YAML'
          services:
            postgres:
              image: postgres:16-alpine
              volumes: !override
                - postgres_data:/var/lib/postgresql/data
          YAML
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/pg16.yml" up -d --wait postgres
          docker compose run --build --rm --no-deps -T backend python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          get_user_model().objects.create_user(username="upgrade-fixture", email="upgrade@example.invalid")
          PY

      - name: Migrate to PostgreSQL 19 and verify the restored user
        run: |
          python3 scripts/migrate_postgres_19.py
          docker compose exec -T backend python manage.py shell <<'PY'
          from django.contrib.auth import get_user_model
          from django.db import connection
          assert connection.pg_version // 10000 == 19
          assert get_user_model().objects.filter(username="upgrade-fixture").exists()
          PY

      - name: Run backend tests on PostgreSQL 19
        run: docker compose exec -T backend python manage.py test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Run frontend tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build
